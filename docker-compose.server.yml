# Hermes Agent + Server Stack (with Ollama Local LLM & Telegram Gateway)
version: '3.8'

services:
  # 1. Hermes Agent Service
  hermes-agent:
    image: ghcr.io/nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./skills:/app/skills:ro
      - ./memories:/app/memories
      - ./SOUL.md:/app/SOUL.md:ro
      - /var/run/docker.sock:/var/run/docker.sock # Allows Hermes to manage Docker containers (Server Guardian)
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-ollama}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://ollama:11434/v1}
    depends_on:
      - ollama
    networks:
      - server-net

  # 2. Local LLM Service (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: hermes-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment the deploy section below if you have NVIDIA GPU in your server
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    ports:
      - "11434:11434"
    networks:
      - server-net

volumes:
  ollama_data:

networks:
  server-net:
    driver: bridge
