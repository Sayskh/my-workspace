model:
  default: upstage/solar-pro4:free
  provider: nous
  base_url: https://inference-api.nousresearch.com/v1
web:
  backend: nous
browser:
  cloud_provider: nous
stt:
  provider: nous
plugins:
  scan_on_install: true
  enabled:
    - superpowers
  disabled: []
onboarding:
  seen:
    busy_input_prompt: true
_config_version: 39
image_gen:
  provider: nous
mcp_servers:
  n8n:
    command: C:/Users/sayyi/AppData/Local/hermes/mcp-installs/n8n/.venv/Scripts/python.exe
    args:
      - C:/Users/sayyi/AppData/Local/hermes/mcp-installs/n8n/server.py
    enabled: true
  context7:
    url: https://mcp.context7.com/mcp
    enabled: true
  cloudflare:
    url: https://mcp.cloudflare.com/mcp?codemode=false
    auth: oauth
    enabled: true
    tools:
      exclude:
        - docs
        - '*_radar_*'
        - '*_accounts_magic_*'
        - '*_accounts_mnm_*'
        - '*_accounts_cni_*'
        - '*_accounts_teamnet_*'
        - '*_accounts_cloudforceone_*'
        - '*_accounts_dlp_*'
        - '*_accounts_devices*'
        - '*_accounts_dex_*'
        - '*_accounts_datasecurity_*'
        - '*_accounts_emailsecurity_*'
        - '*_accounts_scim_*'
        - '*_accounts_gateway*'
        - '*_accounts_zerotrust_*'
        - '*_accounts_one_*'
        - '*_accounts_brandprotection_*'
        - '*_accounts_intel_*'
        - '*_accounts_urlscanner_*'
        - '*_accounts_vuln_scanner_*'
        - '*_zones_securitycenter_*'
        - '*_accounts_securitycenter_*'
        - '*_zones_api_gateway_*'
        - '*_zones_schema_validation*'
        - '*_zones_token_validation*'
        - '*_zones_waiting_rooms*'
        - '*_accounts_addressing_*'
        - '*_accounts_shares*'
        - '*_accounts_slurper_*'
        - '*_zones_web3_*'
        - '*_accounts_flagship_*'
        - '*_zones_secondary_dns_*'
        - '*_accounts_secondary_dns_*'
        - '*_user_load_balancers*'
  semgrep:
    url: https://mcp.semgrep.ai/mcp
    auth: oauth
    enabled: true
    tools:
      exclude:
        - security_check
        - supported_languages
        - semgrep_rule_schema
  sentry:
    url: https://mcp.sentry.dev/mcp
    auth: oauth
    enabled: true
  grafana:
    url: https://mcp.grafana.com/mcp
    auth: oauth
    enabled: true
    tools:
      exclude:
        - ask_assistant
        - agento11y_*
  deepwiki:
    url: https://mcp.deepwiki.com/mcp
    enabled: true
  postman:
    url: https://mcp.postman.com/minimal
    auth: oauth
    enabled: true
  hugging_face:
    url: https://huggingface.co/mcp
    auth: oauth
    enabled: true
  supabase:
    url: https://mcp.supabase.com/mcp
    auth: oauth
    enabled: true
  linear:
    url: https://mcp.linear.app/mcp
    auth: oauth
    enabled: true
  notion:
    url: https://mcp.notion.com/mcp
    auth: oauth
    enabled: true
  todoist:
    url: https://ai.todoist.net/mcp
    auth: oauth
    enabled: true
    tools:
      exclude:
        - search
        - fetch
        - export-project-template
        - import-project-template
  wolfram:
    url: https://agenttools.wolfram.com/mcp
    enabled: true

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4
